name: Go CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sh scripts/check.sh
      - run: docker compose up --build -d --wait
      - run: curl --fail http://localhost:8080/healthz && curl --fail http://localhost:8080/readyz
      - if: always()
        run: docker compose logs && docker compose down
