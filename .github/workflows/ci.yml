name: Go CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DEV_AUTH_ENABLED: 'true'
      DEV_PRINCIPAL: ci-local-user
      DEV_DISPATCH_ENABLED: 'true'
      QUEUE_STREAM: dev:judgegrid:ci-dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sh scripts/check.sh
      - name: Frontend JavaScript syntax
        run: node --check internal/api/ui/app.js
      - run: python3 scripts/check-service-isolation.py
      - name: Validate optional observability configuration
        run: |
          python3 scripts/generate-dashboards.py
          git diff --exit-code -- infra/observability/grafana/dashboards
          docker compose -f docker-compose.yml -f infra/observability.compose.yml --profile observability config --quiet
      - run: docker compose up --build -d --wait
      - run: docker compose run --rm migrate manage check
      - run: docker compose run --rm migrate manage seed
      - name: PostgreSQL integration tests (isolated schemas)
        run: >-
          docker run --rm --network judgegrid_default
          -v "$PWD:/src" -w /src
          -e TEST_DATABASE_URL=postgres://judgegrid:judgegrid@postgres:5432/judgegrid?sslmode=disable
          -e TEST_REDIS_ADDR=redis:6379
          golang:1.26 go test -race -tags=integration -v ./tests
      - run: python3 scripts/smoke.py
      - run: python3 scripts/dispatch_smoke.py
      - name: Explicit isolated outbox relay demonstration
        env:
          OUTBOX_RELAY_ENABLED: 'true'
          OUTBOX_STREAM: test:judgegrid:ci-outbox
        run: |
          docker compose --profile outbox up -d --wait outbox-relay
          python3 scripts/outbox_smoke.py --stream test:judgegrid:ci-outbox
      - name: Actual private metric scraping, trace storage and dashboard provisioning
        env:
          OUTBOX_RELAY_ENABLED: 'true'
          OUTBOX_STREAM: test:judgegrid:ci-observed
        run: |
          docker compose -f docker-compose.yml -f infra/observability.compose.yml --profile observability --profile outbox up --no-deps -d --wait api outbox-relay prometheus tempo grafana
          python3 scripts/observability-smoke.py
      - if: always()
        run: docker compose -f docker-compose.yml -f infra/observability.compose.yml --profile outbox --profile observability logs && docker compose -f docker-compose.yml -f infra/observability.compose.yml --profile outbox --profile observability down
  sandbox:
    runs-on: ubuntu-latest
    env:
      JUDGEGRID_SANDBOX_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Trusted runtime prefetch and image pinning
        run: sh scripts/setup-sandbox.sh
      - name: Restricted sandbox enforcement tests (local controller)
        run: go test -race -tags=sandboxintegration -v ./internal/execution
      - name: Local judge PostgreSQL
        run: docker compose -f docker-compose.yml -f infra/local-judge.compose.yml up -d --wait postgres redis
      - name: Real durable judging matrix
        env:
          JUDGEGRID_JUDGE_TESTS: '1'
          TEST_DATABASE_URL: postgres://judgegrid:judgegrid@127.0.0.1:15432/judgegrid?sslmode=disable
        run: go test -race -tags=judgeintegration -v ./internal/judge
      - name: Trusted automatic judging and execution crash windows
        env:
          JUDGEGRID_AGENT_TESTS: '1'
          TEST_DATABASE_URL: postgres://judgegrid:judgegrid@127.0.0.1:15432/judgegrid?sslmode=disable
          TEST_REDIS_ADDR: 127.0.0.1:16379
        run: go test -race -tags=agentintegration -v ./internal/judge
      - name: Fair automatic judging, observed phases and durable SSE rejudge
        env:
          JUDGEGRID_AGENT_TESTS: '1'
          TEST_DATABASE_URL: postgres://judgegrid:judgegrid@127.0.0.1:15432/judgegrid?sslmode=disable
          TEST_REDIS_ADDR: 127.0.0.1:16379
        run: go test -race -tags=agentintegration,session10integration -run TestS10 -v ./internal/judge
      - name: Immutable MinIO, real compilation cache and versioned rejudge fault matrix
        env:
          JUDGEGRID_AGENT_TESTS: '1'
          TEST_DATABASE_URL: postgres://judgegrid:judgegrid@127.0.0.1:15432/judgegrid?sslmode=disable
          TEST_REDIS_ADDR: 127.0.0.1:16379
          TEST_S3_ENDPOINT: 127.0.0.1:19000
          TEST_MINIO_CONTAINER: judgegrid-minio-1
        run: |
          export MINIO_ROOT_USER=judgegrid-ci-operator
          export MINIO_ROOT_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$MINIO_ROOT_PASSWORD"
          export TEST_S3_ACCESS_KEY=$MINIO_ROOT_USER
          export TEST_S3_SECRET_KEY=$MINIO_ROOT_PASSWORD
          trap 'docker compose -f docker-compose.yml -f infra/local-judge.compose.yml -f infra/object-store.compose.yml down' EXIT
          docker compose -f docker-compose.yml -f infra/local-judge.compose.yml -f infra/object-store.compose.yml up --build --no-deps -d --wait minio
          APP_ENV=development TELEMETRY_ENABLED=true TELEMETRY_ADDR=127.0.0.1:0 TELEMETRY_OTLP_URL=http://127.0.0.1:1 S11_TEST_TELEMETRY=1 go test -race -tags=agentintegration,session9integration,session11integration -run 'TestS9|TestS11' -v ./internal/judge
      - if: always()
        run: docker compose -f docker-compose.yml -f infra/local-judge.compose.yml down
