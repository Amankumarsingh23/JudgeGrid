# Explicit local-development overlay. No object credentials are added to app services.
services:
  minio:
    image: judgegrid-minio:session9
    build:
      context: ..
      dockerfile: infra/objectstore/Dockerfile
    ports:
      - "127.0.0.1:19000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a local operator access key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a local operator secret key}
    volumes:
      - object-data:/data
    mem_limit: 768m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9000/minio/health/live]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  object-data:
