# Independent source storage, with different credentials/volume from hidden tests.
services:
  repository-store:
    image: judgegrid-minio:session9
    build:
      context: .
      dockerfile: infra/objectstore/Dockerfile
    profiles: [repository-storage]
    ports: ["127.0.0.1:19100:9000"]
    environment:
      MINIO_ROOT_USER: ${REPO_MINIO_ROOT_USER:?Set a distinct repository storage operator key}
      MINIO_ROOT_PASSWORD: ${REPO_MINIO_ROOT_PASSWORD:?Set a distinct repository storage operator secret}
    volumes: [repository-source-data:/data]
    mem_limit: 768m
    cpus: 1
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9000/minio/health/live]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  repository-source-data:
