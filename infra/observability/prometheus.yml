global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: judgegrid-api
    static_configs: [{targets: ["api:9091"]}]
  - job_name: judgegrid-relay
    static_configs: [{targets: ["outbox-relay:9092"]}]
  - job_name: judgegrid-agent
    static_configs: [{targets: ["host.docker.internal:19093", "host.docker.internal:19094"]}]
