services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: judgegrid
      POSTGRES_PASSWORD: judgegrid
      POSTGRES_DB: judgegrid
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U judgegrid -d judgegrid]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    image: judgegrid-api
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment: &app-env
      DATABASE_URL: postgres://judgegrid:judgegrid@postgres:5432/judgegrid?sslmode=disable
      REDIS_ADDR: redis:6379
      CHECK_TIMEOUT: 3s
      REQUEST_TIMEOUT: 5s
      APP_ENV: ${APP_ENV:-production}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      DEV_PRINCIPAL: ${DEV_PRINCIPAL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 4s
      retries: 10
  worker:
    image: judgegrid-worker
    build: .
    command: [worker]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  migrate:
    image: judgegrid-api
    build: .
    command: [manage, migrate]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
